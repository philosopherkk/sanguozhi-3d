name: audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      # audit:commit-msgs 要比對 origin/main..HEAD；PR 的預設淺層 checkout
      # 沒有 origin/main，會令該閘門抽不到指標而假紅。取完整歷史與遠端引用。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # 2026-11-27 補：gates 有兩條閘門靠 Python：
      #   audit:geo             → numpy + pillow
      #   verify:chars-coverage → opencc 字典
      # 之前呢度完全唔裝 Python 依賴，而 gate-ci 嘅規矩係「偵測唔到 numpy 就跳過」，
      # 結果 runner 鏡像把系統 python 換做 3.14（冇預裝 numpy）之後，audit:geo 喺 CI
      # 靜靜消失咗好耐，日誌得一行提示，冇人紅過。所以呢度明確釘版本、自己裝齊，
      # 唔再依賴鏡像碰巧內置咗乜（setup-python 會把自己嘅 python 排喺 PATH 前面，
      # 後面的 gates 就用佢）。上面加一條自證：三式依賴任何一樣入唔到就即刻紅，
      # 原因寫喺步驟名度，唔使再翻日誌估。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/workflows/audit.yml'
      - name: 安裝 Python 閘門依賴（numpy・pillow・opencc）
        run: python3 -m pip install numpy pillow opencc-python-reimplemented==0.1.7
      - name: Python 閘門依賴自證（缺一樣即紅，唔准靜靜跳過）
        run: >-
          python3 -c "import numpy, PIL, opencc, os;
          d = os.path.join(os.path.dirname(opencc.__file__), 'dictionary');
          assert os.path.isdir(d), 'opencc 字典目錄缺失: ' + d;
          print('python deps ok:', numpy.__version__, PIL.__version__, d)"
      - run: npm run build
      # oxlint：gates 冇包 lint（佢只量內容／格式以外嘅東西），之前只有本地 agent 記得跑
      # 先有意義，故喺 CI 補一條；有 error 即紅（warning 唔阻）。
      - run: npm run lint
      # 純靜態 SPA：任何 VITE_* 金鑰都會被打進公開 bundle，.gitignore 擋不住，
      # 因此針對建置產物掃金鑰外形。
      - run: npm run check:secrets
      - run: npm run audit:data
      # 2026-11-08 補：test 指令曾指向一個從未入庫的檔案，而 CI 又未執行 test，
      # 因此「測試全綠」長期為空話。加入 CI，讓同類失靈下次即被抓到。
      - run: npm run test
      # 護欄式閘門：與 reports/gate-baseline.json 比較，只在惡化時失敗。
      # 基線由本地 `npm run gates -- --update-baseline` 產生，隨 PR 一起提交。
      - run: npm run gates
