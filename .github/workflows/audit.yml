name: audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      # audit:commit-msgs 要比對 origin/main..HEAD；PR 的預設淺層 checkout
      # 沒有 origin/main，會令該閘門抽不到指標而假紅。取完整歷史與遠端引用。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # 2026-11-27 補：`npm run gates` 入面有兩條閘門用 Python：
      #   audit:geo            → numpy + pillow（ubuntu-latest 系統 Python 已內含）
      #   verify:chars-coverage → opencc 字典（系統冇，必須自己裝）
      # 刻意用系統 python3 安裝，唔用 actions/setup-python：setup-python 會把自己的
      # 解釋器排喺 PATH 前面，而佢冇預裝 numpy／pillow → 反而令 audit:geo 起唔嚟。
      # Ubuntu 24.04 runner 係 externally-managed（PEP 668），所以要 --break-system-packages。
      # 呢條唔係「裝唔到就算」：verify_chars_opencc.py 喺 import opencc 失敗時非零 exit，
      # 閘門會紅（fail-closed）；下面嗰條自證步驟只係令原因一眼睇到，唔係攔河板。
      - name: 安裝覆核工具依賴（opencc，詞典覆蓋率閘門用）
        run: python3 -m pip install --user --break-system-packages opencc-python-reimplemented==0.1.7
      - name: 覆核工具依賴自證（字典檔要搵到）
        run: >-
          python3 -c "import opencc, os;
          d = os.path.join(os.path.dirname(opencc.__file__), 'dictionary');
          assert os.path.isdir(d), 'opencc 字典目錄缺失: ' + d;
          print('opencc dictionary ok:', d)"
      - run: npm run build
      # oxlint：gates 冇包 lint（佢只量內容／格式以外嘅東西），之前只有本地 agent 記得跑
      # 先有意義，故喺 CI 補一條；有 error 即紅（warning 唔阻）。
      - run: npm run lint
      # 純靜態 SPA：任何 VITE_* 金鑰都會被打進公開 bundle，.gitignore 擋不住，
      # 因此針對建置產物掃金鑰外形。
      - run: npm run check:secrets
      - run: npm run audit:data
      # 2026-11-08 補：test 指令曾指向一個從未入庫的檔案，而 CI 又未執行 test，
      # 因此「測試全綠」長期為空話。加入 CI，讓同類失靈下次即被抓到。
      - run: npm run test
      # 護欄式閘門：與 reports/gate-baseline.json 比較，只在惡化時失敗。
      # 基線由本地 `npm run gates -- --update-baseline` 產生，隨 PR 一起提交。
      - run: npm run gates
